name: Release

on:
  push:
    branches:
      - main

# Serializa releases: dois pushes seguidos na main não disputam a mesma tag.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Calcula a próxima versão a partir dos commits (Conventional Commits) e cria a
  # tag UMA vez. Roda antes dos builds, que consomem o resultado via needs/outputs.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      # Corpo da release: relnotes manuais + notas geradas pela API do GitHub.
      release_body: ${{ steps.notes.outputs.body }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # histórico completo p/ calcular o bump

      # dry_run: só calcula a próxima versão, não cria/empurra a tag ainda —
      # o passo "resolve" abaixo pode rebaixar o resultado antes disso.
      - name: Calcular a próxima versão
        id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag_prefix: app-v
          default_bump: patch # fix→patch, feat→minor, BREAKING→major
          dry_run: true

      # Cada major (1.0.0, 2.0.0, 3.0.0...) é um marco de roadmap, não um bump
      # automático: só sai quando o milestone "vN.0" correspondente (issues +
      # PRs planejados pra essa fase) estiver com tudo fechado. Um commit com
      # "BREAKING CHANGE"/"feat!" antes disso bumparia o major sozinho — aqui
      # ele é rebaixado pra um bump de minor (fica na major anterior) em vez de
      # travar a release inteira. Generalizado: cadastre o milestone "vN.0" no
      # GitHub ao planejar a fase N, feche-o quando pronto — nenhum ajuste
      # neste workflow é necessário para N=2, N=3 etc.
      - name: Resolver versão final (rebaixa major prematuro)
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.tag.outputs.new_version }}
          PREV_TAG: ${{ steps.tag.outputs.previous_tag }}
        run: |
          version="$VERSION"

          prev_version="${PREV_TAG#app-v}"
          prev_version="${prev_version:-0.0.0}"
          prev_major="${prev_version%%.*}"
          prev_rest="${prev_version#*.}"
          prev_minor="${prev_rest%%.*}"

          new_major="${version%%.*}"
          new_rest="${version#*.}"
          new_minor="${new_rest%%.*}"
          new_patch="${new_rest#*.}"

          # Só entra em jogo quando o bump cruza pra um major novo (X.0.0 exato).
          if [ "$new_major" -gt "$prev_major" ] && [ "$new_minor" = "0" ] && [ "$new_patch" = "0" ]; then
            milestone_title="v${new_major}.0"
            open=$(gh api "repos/${GITHUB_REPOSITORY}/milestones" \
              --jq --arg t "$milestone_title" '.[] | select(.title == $t) | .open_issues')
            if [ "$open" = "0" ]; then
              echo "Milestone \"$milestone_title\" concluído — liberando $version."
            else
              # "$open" vazio (milestone não encontrado) conta como "não confirmado" — rebaixa também.
              echo "::notice::Milestone \"$milestone_title\" ainda não concluído (aberto(s): ${open:-desconhecido}) — rebaixando de $version para minor."
              version="${prev_major}.$((prev_minor + 1)).0"
            fi
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=app-v$version" >> "$GITHUB_OUTPUT"

      - name: Criar e enviar a tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git tag "${{ steps.resolve.outputs.tag }}"
          git push origin "${{ steps.resolve.outputs.tag }}"

      # Combina os destaques manuais (relnotes/vX.Y.md, se existir) com as notas
      # automáticas da API do GitHub (lista de PRs + contribuidores). Se a API
      # falhar, cai no changelog de Conventional Commits calculado pela tag action.
      - name: Montar corpo da release
        id: notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.resolve.outputs.tag }}
          PREV_TAG: ${{ steps.tag.outputs.previous_tag }}
          VERSION: ${{ steps.resolve.outputs.version }}
          CHANGELOG: ${{ steps.tag.outputs.changelog }}
        run: |
          body_file=$(mktemp)

          manual="relnotes/v$(echo "$VERSION" | cut -d. -f1,2).md"
          if [ -f "$manual" ]; then
            cat "$manual" >> "$body_file"
            echo "" >> "$body_file"
          fi

          args=(-f tag_name="$TAG")
          # Na primeira release a tag anterior (app-v0.0.0) não existe; nesse caso
          # a API detecta o intervalo sozinha.
          if git rev-parse -q --verify "refs/tags/$PREV_TAG" >/dev/null; then
            args+=(-f previous_tag_name="$PREV_TAG")
          fi
          if ! gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              "${args[@]}" --jq '.body' >> "$body_file"; then
            echo "::warning::generate-notes falhou; usando o changelog de commits."
            printf '%s\n' "$CHANGELOG" >> "$body_file"
          fi

          {
            echo "body<<RELNOTES_EOF"
            cat "$body_file"
            echo ""
            echo "---"
            echo "Baixe o instalador da sua plataforma nos assets abaixo."
            echo "RELNOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # DESABILITADO até os secrets ANDROID_KEYSTORE_BASE64 / ANDROID_STORE_PASSWORD /
  # ANDROID_KEY_PASSWORD serem configurados no GitHub (a validação de secrets
  # abortava este job e derrubava o workflow inteiro a cada push na main).
  # Para reativar: remover o `if: false` (ver
  # https://jidvdij.github.io/slot2sync-site/docs/dev/guias/setup-tooling-pendente/).
  android:
    if: false
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Builds reproduzíveis: timestamp fixo do commit em vez do relógio do runner.
      - name: Definir SOURCE_DATE_EPOCH
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5.6.0
        with:
          java-version: "17"
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;26.3.11579264"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validar secrets
        env:
          SLOT2SYNC_GOOGLE_CLIENT_ID: ${{ secrets.SLOT2SYNC_GOOGLE_CLIENT_ID }}
          SLOT2SYNC_TOKEN_PROXY_URL: ${{ secrets.SLOT2SYNC_TOKEN_PROXY_URL }}
          SLOT2SYNC_PROXY_SECRET: ${{ secrets.SLOT2SYNC_PROXY_SECRET }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=()
          for v in SLOT2SYNC_GOOGLE_CLIENT_ID SLOT2SYNC_TOKEN_PROXY_URL SLOT2SYNC_PROXY_SECRET \
                    ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD; do
            [ -z "${!v}" ] && missing+=($v)
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Secrets ausentes: ${missing[*]}"
            exit 1
          fi

      - name: Definir versão do app
        run: |
          v="${{ needs.version.outputs.version }}"
          jq --arg v "$v" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json

      - name: Decodificar keystore
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > slot2sync.jks

      - name: Build APK Android (aarch64)
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/slot2sync.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_ALIAS: retrosync
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/26.3.11579264
          SLOT2SYNC_GOOGLE_CLIENT_ID: ${{ secrets.SLOT2SYNC_GOOGLE_CLIENT_ID }}
          SLOT2SYNC_TOKEN_PROXY_URL: ${{ secrets.SLOT2SYNC_TOKEN_PROXY_URL }}
          SLOT2SYNC_PROXY_SECRET: ${{ secrets.SLOT2SYNC_PROXY_SECRET }}
        run: npm run tauri android build -- --target aarch64

      - name: Remover keystore
        if: always()
        run: rm -f slot2sync.jks

      - name: Upload APK e AAB para a release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          body: ${{ needs.version.outputs.release_body }}
          files: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    needs: version
    # Sobrescreve o `permissions:` do workflow (nível job zera o herdado):
    # `contents: write` continua necessário para o tauri-action publicar os
    # assets; `id-token`/`attestations` são exigidos pelo
    # attest-build-provenance abaixo para assinar a proveniência SLSA.
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest # Apple Silicon
            args: --target aarch64-apple-darwin
          - platform: macos-latest # Intel
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      # Builds reproduzíveis: timestamp fixo do commit em vez do relógio do runner.
      - name: Definir SOURCE_DATE_EPOCH
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --pretty=%ct)" >> "$GITHUB_ENV"

      - name: Validar secrets de credenciais
        shell: bash
        env:
          SLOT2SYNC_GOOGLE_CLIENT_ID: ${{ secrets.SLOT2SYNC_GOOGLE_CLIENT_ID }}
          SLOT2SYNC_TOKEN_PROXY_URL: ${{ secrets.SLOT2SYNC_TOKEN_PROXY_URL }}
          SLOT2SYNC_PROXY_SECRET: ${{ secrets.SLOT2SYNC_PROXY_SECRET }}
        run: |
          missing=()
          if [ -z "$SLOT2SYNC_GOOGLE_CLIENT_ID" ]; then missing+=(SLOT2SYNC_GOOGLE_CLIENT_ID); fi
          if [ -z "$SLOT2SYNC_TOKEN_PROXY_URL" ]; then missing+=(SLOT2SYNC_TOKEN_PROXY_URL); fi
          if [ -z "$SLOT2SYNC_PROXY_SECRET" ]; then missing+=(SLOT2SYNC_PROXY_SECRET); fi
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::Secrets de credenciais ausentes: ${missing[*]} — release abortada para não publicar um binário sem credenciais."
            exit 1
          fi
          echo "Secrets de credenciais presentes."

      # Injeta a versão calculada no bundle. A version do tauri.conf.json tem
      # precedência sobre o Cargo.toml, então o binário sai batendo com a tag.
      - name: Definir versão do app
        shell: bash
        run: |
          v="${{ needs.version.outputs.version }}"
          jq --arg v "$v" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json
          echo "Versão do bundle definida para $v"

      - name: Install system dependencies (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install dependencies
        run: npm ci

      # Assinatura + notarização do macOS: as variáveis APPLE_* só podem entrar
      # no ambiente quando os secrets EXISTEM — o bundler do Tauri trata
      # variável definida (mesmo vazia) como "assinar", tenta importar um
      # certificado vazio no keychain e derruba o build. Sem certificado, o
      # .app sai sem assinatura (abrir com clique-direito → Abrir); ao criar os
      # secrets APPLE_*, a assinatura reativa sozinha.
      - name: Habilitar assinatura macOS (quando houver certificado)
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "Sem APPLE_CERTIFICATE — o build macOS sairá sem assinatura."
            exit 0
          fi
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY \
                   APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            printf '%s<<__APPLE_EOF__\n%s\n__APPLE_EOF__\n' "$v" "${!v}" >> "$GITHUB_ENV"
          done
          echo "Assinatura macOS habilitada."

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SLOT2SYNC_GOOGLE_CLIENT_ID: ${{ secrets.SLOT2SYNC_GOOGLE_CLIENT_ID }}
          SLOT2SYNC_TOKEN_PROXY_URL: ${{ secrets.SLOT2SYNC_TOKEN_PROXY_URL }}
          SLOT2SYNC_PROXY_SECRET: ${{ secrets.SLOT2SYNC_PROXY_SECRET }}
        with:
          tagName: ${{ needs.version.outputs.tag }}
          releaseName: Slot2Sync v${{ needs.version.outputs.version }}
          releaseBody: ${{ needs.version.outputs.release_body }}
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Proveniência SLSA assinada (Sigstore) para os instaladores publicados
      # — cada plataforma só produz um subconjunto destas extensões; padrões
      # sem correspondência nesta matriz específica são ignorados, desde que
      # ao menos um arquivo bata em algum deles.
      - name: Assinar proveniência de build (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.app.tar.gz
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
