name: Sugerir uma funcionalidade
description: Proponha uma ideia de melhoria para o Slot2Sync.
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Antes de continuar, confira se já não existe uma
        [issue aberta](https://github.com/jIDvDIj/slot2sync/issues) com a mesma ideia, e dê
        uma olhada no [roadmap](https://jidvdij.github.io/slot2sync-site/docs/dev/roadmap)
        — talvez já esteja planejado.

  - type: textarea
    id: feature
    attributes:
      label: Descrição da funcionalidade
      description: Descreva o comportamento que você gostaria de ver.
    validations:
      required: true

  - type: textarea
    id: problem-usecase
    attributes:
      label: Problema ou caso de uso
      description: Que problema isso resolve, ou qual é o caso de uso? É mais provável ser implementado se for útil para um número maior de usuários.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternativas ou soluções de contorno
      description: Descreva alternativas ou soluções de contorno que você já considerou (e talvez tenha descartado).
    validations:
      required: true
