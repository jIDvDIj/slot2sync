name: Relatar um bug
description: Algo não funcionou como esperado no Slot2Sync.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar! Antes de continuar, confira se já não existe uma
        [issue aberta](https://github.com/jIDvDIj/slot2sync/issues) sobre o mesmo problema.

        **Encontrou uma vulnerabilidade de segurança?** Não abra uma issue pública — siga o
        processo descrito em [`SECURITY.md`](../../SECURITY.md).

  - type: textarea
    id: description
    attributes:
      label: O que aconteceu?
      description: Descreva o problema com o máximo de detalhe possível.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Passo a passo para chegar no problema.
      placeholder: |
        1. Abra o Slot2Sync
        2. Conecte a conta do Google Drive
        3. Abra o PPSSPP
        4. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportamento esperado
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Sistema operacional
      options:
        - Windows
        - macOS
        - Linux
        - Steam Deck
        - Android
        - Outro (descreva no campo acima)
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Versão do Slot2Sync
      description: Veja em Configurações, ou o nome do instalador baixado (ex. `v1.4.0`).
      placeholder: v1.4.0
    validations:
      required: true

  - type: input
    id: emulator
    attributes:
      label: Emulador envolvido
      description: Se o bug for específico de um emulador. Deixe em branco se não se aplica.
      placeholder: PPSSPP, PCSX2...

  - type: dropdown
    id: provider
    attributes:
      label: Provedor de armazenamento
      options:
        - Google Drive
        - Dropbox
        - OneDrive
        - Pasta local/de rede
        - Não sei / não se aplica
    validations:
      required: false

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnóstico
      description: |
        Se possível, gere o arquivo de diagnóstico em **Configurações → Backups → Exportar
        diagnóstico** e anexe o `.zip` aqui (arraste o arquivo para esta caixa de texto). Ele
        reúne logs, fila de pendências e histórico de erros recentes sem expor tokens.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Contexto adicional
      description: Screenshots, logs extras, ou qualquer outra informação relevante.
    validations:
      required: false
