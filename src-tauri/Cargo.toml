[package]
name = "slot2sync"
version = "0.1.0"
description = "Sincronização automática de saves e configurações de emuladores com a nuvem"
authors = ["David"]
edition = "2021"
license = "GPL-3.0-or-later"
# App distribuído como binário, nunca publicado no crates.io.
publish = false

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "slot2sync_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
async-trait = "0.1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "stream",
  "rustls-tls",
  "http2",
  "charset",
] }

rusqlite = { version = "0.40", features = ["bundled"] }

chrono = { version = "0.4", features = ["serde"] }
url = "2"
open = "5"
dirs = "6"
futures = "0.3"
filetime = "0.2"
sha2 = "0.11"
rayon = "1"
globset = "0.4"
# Confere o conteúdo baixado contra o `md5Checksum` devolvido pela API do Drive.
md-5 = "0.11"
rand = "0.9"
base64 = "0.23"
uuid = { version = "1", features = ["v4"] }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Dependências exclusivas do ambiente desktop — NÃO compiladas para Android/iOS.
# O process watcher (`sysinfo`) e o autostart ("subir com o sistema") não têm
# equivalente no mobile; lá os gatilhos de sync são manuais / ao abrir o app.
#
# NOTA: cfg(desktop) é definido pelo build script do Tauri e não é reconhecido
# pelo Cargo na resolução de dependências. A forma correta para seções
# [target.*.dependencies] é usar predicados padrão do Rust (target_os).
# O #[cfg(desktop)] no código-fonte continua funcionando — o build script já
# rodou quando o compilador avalia atributos de item.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
sysinfo = "0.39"
# Watcher de filesystem nativo (ReadDirectoryChangesW/inotify/FSEvents) para o
# gatilho "file-change" — sincroniza sem esperar o emulador fechar.
notify = "8"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service"] }
# Empacota o export de diagnóstico (`export_diagnostics`, só desktop) num
# único .zip.
zip = { version = "2", default-features = false, features = ["deflate"] }

# Dependências exclusivas do mobile.
# - deep-link: captura o redirect URI `slot2sync://oauth` de volta ao app (OAuth).
# - opener: abre o browser no Android (o crate `open` não funciona em processo sandboxado).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"

# Leitura do registro do Windows para a descoberta de instalações (Sinal B).
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# SetPriorityClass: baixa a prioridade do processo no startup para não competir
# por I/O com o emulador aberto.
windows = { version = "0.58", features = ["Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
# `start_paused` (tempo virtual) nos testes do rate limiter — sem esperas reais.
tokio = { version = "1", features = ["test-util"] }
# Servidor HTTP fake para os testes do DriveClient (list_tree, find_child,
# download, upload_new/existing): exercita o código real de request/parse
# contra localhost, sem depender do Google nem de credenciais.
wiremock = "0.6"

# MockRuntime p/ construir AppHandle sem janela nos testes do SyncEngine (issue #82).
# NÃO-Windows de propósito: a feature `test` do tauri derruba o executável de
# teste no Windows com STATUS_ENTRYPOINT_NOT_FOUND (bug upstream sem correção —
# tauri-apps/tauri#13419/#11028). Os cenários rodam no Linux/macOS; o job de
# Windows segue compilando e rodando o restante da suíte.
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2", features = ["test"] }

[features]
# Reservada p/ testes de integração com credenciais reais do Drive (issue #82);
# hoje nenhum teste a usa — os cenários rodam 100% no MockDrive, sem rede.
integration-tests = []
